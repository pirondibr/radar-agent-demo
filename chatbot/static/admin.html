<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Admin — Usos & Logs</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e2330;--border:#2a3142;--text:#e8eaef;--muted:#8b93a7;--accent:#6366f1;--ok:#10b981;--err:#ef4444;--warn:#f59e0b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;font-weight:700}
header .meta{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono)}
button,a.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-decoration:none}
button:hover,a.btn:hover{border-color:var(--accent)}
button.danger{border-color:rgba(239,68,68,.45);color:#fecaca;background:rgba(239,68,68,.08)}
button.danger:hover{border-color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toast{font-size:12px;color:var(--muted);font-family:var(--mono)}
.toast.ok{color:var(--ok)}.toast.err{color:var(--err)}
.layout{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 52px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.list{border-right:1px solid var(--border);overflow:auto;max-height:calc(100vh - 52px)}
.item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.item:hover,.item.active{background:var(--panel2)}
.item .t{font-weight:600;font-size:13px;margin-bottom:4px}
.item .s{font-size:11px;color:var(--muted);font-family:var(--mono);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.item .s-metrics{gap:10px}
.item .s-metrics .metric{padding:2px 7px;border-radius:5px;border:1px solid transparent;background:rgba(139,147,167,.08)}
.item .s-metrics .metric.hot-marca{color:#fcd34d;background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.35);font-weight:700}
.item .s-metrics .metric.hot-gads{color:#6ee7b7;background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.35);font-weight:700}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.b-done{background:rgba(16,185,129,.15);color:var(--ok)}
.b-error{background:rgba(239,68,68,.15);color:var(--err)}
.b-running{background:rgba(245,158,11,.15);color:var(--warn)}
.b-pending{background:rgba(139,147,167,.15);color:var(--muted)}
.b-src{background:rgba(99,102,241,.15);color:#a5b4fc;text-transform:none;letter-spacing:0}
.b-src-google{background:rgba(66,133,244,.18);color:#93c5fd}
.b-src-meta{background:rgba(24,119,242,.18);color:#93c5fd}
.b-src-organic{background:rgba(16,185,129,.15);color:#6ee7b7}
.b-src-direct{background:rgba(139,147,167,.15);color:#cbd5e1}
.b-funnel{background:rgba(245,158,11,.18);color:#fcd34d;text-transform:none}
.detail{padding:18px 20px;overflow:auto;max-height:calc(100vh - 52px)}
.empty{color:var(--muted);padding:40px;text-align:center}
h2{font-size:18px;margin-bottom:6px}
.sub{color:var(--muted);font-size:12px;font-family:var(--mono);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
.card .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card .v{font-size:18px;font-weight:700;margin-top:4px;font-family:var(--mono)}
section{margin-bottom:22px}
section h3{font-size:13px;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600}
.logbox{background:#0b0d11;border:1px solid var(--border);border-radius:10px;padding:12px;max-height:360px;overflow:auto;font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre-wrap}
.log-error{color:var(--err)}.log-warn{color:var(--warn)}
.arts a{color:#a5b4fc;margin-right:10px}
.errbox{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.35);color:#fecaca;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filters label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.filters input[type=date],.filters select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px;font-family:var(--mono)}
.filters input[type=date]:focus,.filters select:focus{outline:none;border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Radar Admin — Usos & Logs</h1>
  <button type="button" id="btnRefresh">Atualizar</button>
  <button type="button" id="btnLeads">Leads / WhatsApp</button>
  <div class="filters">
    <label>Data
      <input type="date" id="filterDate" title="Filtrar por dia (fuso BR). Vazio = todos">
    </label>
    <label>Canal
      <select id="filterChannel" title="Filtrar por origem de tráfego">
        <option value="">Todos</option>
        <option value="meta">Meta</option>
        <option value="google">Google Ads</option>
      </select>
    </label>
  </div>
  <div class="meta" id="hdrMeta">carregando…</div>
</header>
<div class="layout">
  <aside class="list" id="runList"></aside>
  <main class="detail" id="detail"><div class="empty">Selecione um uso à esquerda</div></main>
</div>
<script>
const qs = new URLSearchParams(location.search);
const token = qs.get('token') || '';
const api = (path) => fetch(path + (token ? (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token) : ''));

function fmtTs(ts) {
  if (!ts) return '—';
  const d = new Date(Number(ts) * 1000);
  return d.toLocaleString('pt-BR');
}
function fmtMs(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + ' ms';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}
function badge(status) {
  const s = (status || '').toLowerCase();
  const cls = s === 'done' ? 'b-done' : (s === 'error' ? 'b-error' : (s === 'running' ? 'b-running' : 'b-pending'));
  return `<span class="badge ${cls}">${s || '?'}</span>`;
}
function readAttr(run) {
  try { return JSON.parse((run && run.attribution_json) || '{}') || {}; } catch (e) { return {}; }
}
function funnelBadge(run) {
  const attr = readAttr(run);
  const landing = String(attr.landing || '');
  if (attr.funnel === 'radar_47' || /\/47(\/|\?|$)/.test(landing)) {
    return '<span class="badge b-funnel" title="Consulta vinda de /47">Radar /47</span>';
  }
  return '';
}
function adsCampaign(attr) {
  return String((attr && (attr.utm_campaign || attr.campaign_name || attr.campaignid || attr.campaign_id)) || '').trim();
}
function adsKeyword(attr) {
  return String((attr && (attr.keyword || attr.adset_name || attr.utm_term || attr.adset_id)) || '').trim();
}
function adsCreative(attr) {
  return String((attr && (attr.ad_name || attr.utm_content || attr.ad_id || attr.creative)) || '').trim();
}
function sourceBadge(src) {
  const s = (src || '').trim() || '—';
  let cls = 'b-src';
  const low = s.toLowerCase();
  if (low.includes('google')) cls += ' b-src-google';
  else if (low.includes('meta')) cls += ' b-src-meta';
  else if (low.includes('org')) cls += ' b-src-organic';
  else if (low.includes('diret')) cls += ' b-src-direct';
  return `<span class="badge ${cls}" title="Origem do lead/tráfego">${esc(s)}</span>`;
}
function metricNum(raw) {
  if (raw == null || raw === '') return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}

let selectedId = null;

function filterQuery() {
  const date = (document.getElementById('filterDate')?.value || '').trim();
  const source = (document.getElementById('filterChannel')?.value || '').trim();
  const parts = [];
  if (date) parts.push('date=' + encodeURIComponent(date));
  if (source) parts.push('source=' + encodeURIComponent(source));
  return parts.length ? ('&' + parts.join('&')) : '';
}
function filterLabel() {
  const date = (document.getElementById('filterDate')?.value || '').trim();
  const source = (document.getElementById('filterChannel')?.value || '').trim();
  const bits = [];
  if (date) {
    const [y, m, d] = date.split('-');
    bits.push(d && m && y ? `${d}/${m}/${y}` : date);
  } else {
    bits.push('todos os dias');
  }
  if (source === 'meta') bits.push('Meta');
  else if (source === 'google') bits.push('Google Ads');
  else bits.push('todos os canais');
  return bits.join(' · ');
}

async function loadRuns() {
  const res = await api('/api/admin/runs?limit=120' + filterQuery());
  if (!res.ok) {
    document.getElementById('runList').innerHTML = `<div class="empty">Erro ${res.status}. Use /admin?token=...</div>`;
    return;
  }
  const data = await res.json();
  const runs = data.runs || [];
  document.getElementById('hdrMeta').textContent = runs.length + ' usos · ' + filterLabel();
  const el = document.getElementById('runList');
  if (!runs.length) {
    el.innerHTML = '<div class="empty">Nenhum uso com esses filtros</div>';
    return;
  }
  el.innerHTML = runs.map(r => {
    const a = readAttr(r);
    const camp = adsCampaign(a);
    const kw = adsKeyword(a);
    const ad = adsCreative(a);
    let summary = {};
    try { summary = JSON.parse(r.report_summary_json || '{}') || {}; } catch (e) { summary = {}; }
    const marcaNum = metricNum(summary.client_brand);
    const gadsNum = metricNum(summary.client_ads);
    const marca = summary.client_brand_fmt || (marcaNum != null ? String(marcaNum) : '');
    const gads = summary.client_ads_fmt || (gadsNum != null ? String(gadsNum) : '');
    const marcaRank = summary.client_brand_rank ? ` (${summary.client_brand_rank}º)` : '';
    const gadsRank = summary.client_ads_rank ? ` (${summary.client_ads_rank}º)` : '';
    const marcaHot = marcaNum != null && marcaNum > 100;
    const gadsHot = gadsNum != null && gadsNum > 10;
    return `
    <div class="item ${r.id === selectedId ? 'active' : ''}" data-id="${r.id}">
      <div class="t">${esc(r.company || r.slug || r.id)} ${badge(r.status)}</div>
      <div class="s">
        <span>${esc(r.kind || 'free')}</span>
        <span>${esc(r.mode || '—')}</span>
        ${sourceBadge(r.traffic_source)}
        ${funnelBadge(r)}
      </div>
      <div class="s s-metrics">
        <span class="metric${marcaHot ? ' hot-marca' : ''}" title="Marca do cliente">Marca: ${esc(marca || '—')}${esc(marcaRank)}</span>
        <span class="metric${gadsHot ? ' hot-gads' : ''}" title="Google Ads do cliente">GAds: ${esc(gads || '—')}${esc(gadsRank)}</span>
      </div>
      <div class="s">
        ${camp ? `<span title="Campanha">camp: ${esc(camp)}</span>` : ''}
        ${ad ? `<span title="Anúncio">ad: ${esc(ad)}</span>` : ''}
        ${kw ? `<span title="Keyword / Ad set">kw: ${esc(kw)}</span>` : ''}
        ${r.contact ? `<span title="WhatsApp">WA ${esc(r.contact)}</span>` : ''}
        <span>${fmtTs(r.started_at)}</span>
        <span>${fmtMs(r.duration_ms)}</span>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('.item').forEach(node => {
    node.addEventListener('click', () => openRun(node.dataset.id));
  });
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function openRun(id) {
  selectedId = id;
  document.querySelectorAll('.item').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  const res = await api('/api/admin/runs/' + encodeURIComponent(id));
  const detail = document.getElementById('detail');
  if (!res.ok) {
    detail.innerHTML = `<div class="empty">Falha ao carregar run</div>`;
    return;
  }
  const { run, steps, artifacts, logs } = await res.json();
  let summary = {};
  try { summary = JSON.parse(run.report_summary_json || '{}') || {}; } catch(e) {}
  let attr = {};
  try { attr = JSON.parse(run.attribution_json || '{}') || {}; } catch(e) {}
  const camp = adsCampaign(attr);
  const kw = adsKeyword(attr);
  const ad = adsCreative(attr);
  const attrBits = [
    attr.utm_source && ('utm_source=' + attr.utm_source),
    attr.utm_medium && ('utm_medium=' + attr.utm_medium),
    camp && ('campanha=' + camp),
    ad && ('anuncio=' + ad),
    kw && ('keyword_adset=' + kw),
    attr.utm_content && ('utm_content=' + attr.utm_content),
    attr.adgroupid && ('adgroupid=' + attr.adgroupid),
    attr.adset_id && ('adset_id=' + attr.adset_id),
    attr.ad_id && ('ad_id=' + attr.ad_id),
    attr.campaign_id && ('campaign_id=' + attr.campaign_id),
    attr.creative && ('creative=' + attr.creative),
    attr.network && ('network=' + attr.network),
    attr.matchtype && ('matchtype=' + attr.matchtype),
    attr.device && ('device=' + attr.device),
    attr.placement && ('placement=' + attr.placement),
    attr.gclid && ('gclid=' + attr.gclid),
    attr.fbclid && 'fbclid',
    attr.referrer && ('ref=' + attr.referrer),
    attr.landing && ('landing=' + attr.landing),
    attr.funnel && ('funnel=' + attr.funnel),
    (attr.whatsapp || attr.contact) && ('whatsapp=' + (attr.whatsapp || attr.contact)),
  ].filter(Boolean);
  const srcLow = String(run.traffic_source || '').toLowerCase();
  let adsHint = '';
  if (srcLow.includes('google') && !camp && !kw) {
    adsHint = '<div class="sub" style="margin-top:8px;color:var(--warn)">Google Ads sem campanha/keyword na URL. Configure Final URL suffix na conta Ads.</div>';
  } else if (srcLow.includes('meta') && !camp && !ad) {
    adsHint = '<div class="sub" style="margin-top:8px;color:var(--warn)">Meta Ads sem campanha/anúncio na URL. Configure URL parameters no Ads Manager ({{campaign.name}}, {{ad.name}}).</div>';
  }

  detail.innerHTML = `
    <h2>${esc(run.company || run.slug || run.id)}</h2>
    <div class="sub">${esc(run.id)} · ${esc(run.url || '')} · ${badge(run.status)} · mode ${esc(run.mode || '—')} · ${sourceBadge(run.traffic_source)} ${funnelBadge(run)}</div>
    ${run.error_message ? `<div class="errbox">${esc(run.error_message)}</div>` : ''}
    <div class="actions">
      <a class="btn" id="btnExportHtml" href="/api/admin/runs/${encodeURIComponent(id)}/export.html${token ? '?token=' + encodeURIComponent(token) : ''}" target="_blank" rel="noopener">
        Baixar relatório (HTML/PDF)
      </a>
      <button type="button" class="danger" id="btnClearCache" ${run.slug ? '' : 'disabled'} title="Apaga XLSX de outputs para forçar análise ao vivo">
        Limpar cache e refazer
      </button>
      ${(String(run.status || '').toLowerCase() === 'running') ? `
      <button type="button" id="btnMarkDone" title="Marca este uso como concluído (se ficou preso em running)">
        Marcar como concluído
      </button>` : ''}
      <span class="toast" id="clearToast"></span>
    </div>
    <div class="grid">
      <div class="card"><div class="k">Origem</div><div class="v" style="font-size:14px">${esc(run.traffic_source || '—')} ${funnelBadge(run)}</div></div>
      <div class="card"><div class="k">Marca Cliente</div><div class="v" style="font-size:13px">${esc(summary.client_brand_fmt || (summary.client_brand != null ? String(summary.client_brand) : '—'))}${summary.client_brand_rank ? ` <span style="font-size:11px;color:var(--muted)">${esc(String(summary.client_brand_rank))}º</span>` : ''}</div></div>
      <div class="card"><div class="k">Google Ads Cliente</div><div class="v" style="font-size:13px">${esc(summary.client_ads_fmt || (summary.client_ads != null ? String(summary.client_ads) : '—'))}${summary.client_ads_rank ? ` <span style="font-size:11px;color:var(--muted)">${esc(String(summary.client_ads_rank))}º</span>` : ''}</div></div>
      <div class="card"><div class="k">Campanha</div><div class="v" style="font-size:13px">${esc(camp || '—')}</div></div>
      <div class="card"><div class="k">Anúncio</div><div class="v" style="font-size:13px">${esc(ad || '—')}</div></div>
      <div class="card"><div class="k">Keyword / Ad set</div><div class="v" style="font-size:13px">${esc(kw || '—')}</div></div>
      <div class="card"><div class="k">WhatsApp</div><div class="v" style="font-size:14px">${esc(run.contact || attr.whatsapp || attr.contact || '—')}</div></div>
      <div class="card"><div class="k">Duração</div><div class="v">${fmtMs(run.duration_ms)}</div></div>
      <div class="card"><div class="k">Início</div><div class="v" style="font-size:13px">${fmtTs(run.started_at)}</div></div>
      <div class="card"><div class="k">Tipo</div><div class="v" style="font-size:14px">${esc(run.kind)}</div></div>
      <div class="card"><div class="k">Slug</div><div class="v" style="font-size:13px">${esc(run.slug || '—')}</div></div>
    </div>
    ${(attrBits.length || adsHint) ? `<section><h3>Atribuição (UTM / Google Ads)</h3><div class="sub" style="margin:0">${esc(attrBits.join(' · ') || 'sem UTM/ValueTrack')}</div>${adsHint}</section>` : ''}

    <section>
      <h3>Etapas</h3>
      <table>
        <thead><tr><th>Etapa</th><th>Status</th><th>Tempo</th><th>Empresas</th><th>Alto</th><th>Médio</th><th>UI</th><th>Tier</th><th>Detalhe</th></tr></thead>
        <tbody>
          ${(steps || []).map(s => `
            <tr>
              <td>${esc(s.step_id)}</td>
              <td>${badge(s.state)}</td>
              <td>${fmtMs(s.duration_ms)}</td>
              <td>${s.companies_found ?? '—'}</td>
              <td>${s.altos_found ?? '—'}</td>
              <td>${s.medios_found ?? '—'}</td>
              <td>${s.competitors_count_ui ?? '—'}</td>
              <td>${esc(s.display_tier || '—')}</td>
              <td>${esc(s.detail || s.error_message || '')}</td>
            </tr>`).join('') || '<tr><td colspan="9">Sem etapas</td></tr>'}
        </tbody>
      </table>
    </section>

    <section>
      <h3>Artefatos (dados da pesquisa)</h3>
      <div class="arts">
        ${(artifacts || []).map(a => {
          const href = '/api/admin/runs/' + encodeURIComponent(id) + '/file?artifact_id=' + a.id + (token ? '&token=' + encodeURIComponent(token) : '');
          return `<a href="${href}" target="_blank" rel="noopener">${esc(a.kind)} (${esc((a.meta_json && JSON.parse(a.meta_json||'{}').name) || a.path.split(/[/\\\\]/).pop())})</a>`;
        }).join('') || '<span style="color:var(--muted)">Nenhum artefato ainda</span>'}
      </div>
    </section>

    <section>
      <h3>Logs de execução</h3>
      <div class="logbox">${(logs || []).map(l => {
        const cls = l.level === 'error' ? 'log-error' : (l.level === 'warn' ? 'log-warn' : '');
        return `<div class="${cls}">[${fmtTs(l.ts)}] ${esc(l.message)}</div>`;
      }).join('') || 'Sem logs'}</div>
    </section>
  `;

  const btnClear = document.getElementById('btnClearCache');
  if (btnClear) {
    btnClear.addEventListener('click', () => clearCache(run));
  }
  const btnMark = document.getElementById('btnMarkDone');
  if (btnMark) {
    btnMark.addEventListener('click', () => markRunDone(run));
  }
}

async function markRunDone(run) {
  const toast = document.getElementById('clearToast');
  const btn = document.getElementById('btnMarkDone');
  if (!confirm(`Marcar o uso "${run.id}" como concluído?`)) return;
  if (btn) btn.disabled = true;
  if (toast) { toast.className = 'toast'; toast.textContent = 'Atualizando…'; }
  try {
    const path = '/api/admin/runs/' + encodeURIComponent(run.id) + '/mark-done' + (token ? '?token=' + encodeURIComponent(token) : '');
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { 'X-Admin-Token': token } : {}) },
      body: JSON.stringify({ status: 'done' }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (toast) { toast.className = 'toast err'; toast.textContent = data.error || ('Erro ' + res.status); }
      return;
    }
    if (toast) { toast.className = 'toast ok'; toast.textContent = 'Marcado como concluído.'; }
    await loadRuns();
    openRun(run.id);
  } catch (e) {
    if (toast) { toast.className = 'toast err'; toast.textContent = String(e.message || e); }
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function clearCache(run) {
  const slug = (run.slug || '').trim();
  if (!slug) return;
  const toast = document.getElementById('clearToast');
  const btn = document.getElementById('btnClearCache');
  const ok = confirm(
    `Limpar cache de "${slug}"?\n\nIsso apaga os XLSX em outputs (métricas, briefing, concorrentes).\nO próximo pedido no chat vai rodar a análise completa de novo.`
  );
  if (!ok) return;
  if (btn) btn.disabled = true;
  if (toast) { toast.className = 'toast'; toast.textContent = 'Limpando…'; }
  try {
    const path = '/api/admin/clear-cache' + (token ? '?token=' + encodeURIComponent(token) : '');
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { 'X-Admin-Token': token } : {}) },
      body: JSON.stringify({ slug, run_id: run.id }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (toast) { toast.className = 'toast err'; toast.textContent = data.error || ('Erro ' + res.status); }
      return;
    }
    const n = (data.deleted || []).length;
    if (toast) {
      toast.className = 'toast ok';
      toast.textContent = n
        ? `Cache limpo (${n} pasta${n > 1 ? 's' : ''}). Pode rodar de novo no chat.`
        : 'Nada para apagar (já estava limpo). Pode rodar de novo.';
    }
  } catch (e) {
    if (toast) { toast.className = 'toast err'; toast.textContent = String(e.message || e); }
  } finally {
    if (btn) btn.disabled = false;
  }
}

document.getElementById('btnRefresh').addEventListener('click', loadRuns);
document.getElementById('btnLeads').addEventListener('click', loadLeads);
document.getElementById('filterDate').addEventListener('change', () => { loadRuns(); });
document.getElementById('filterChannel').addEventListener('change', () => { loadRuns(); });
loadRuns();
setInterval(loadRuns, 15000);

async function loadLeads() {
  selectedId = null;
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="empty">Carregando leads…</div>';
  const res = await api('/api/admin/leads?limit=120' + filterQuery());
  if (!res.ok) {
    detail.innerHTML = `<div class="empty">Erro ${res.status} ao carregar leads</div>`;
    return;
  }
  const data = await res.json();
  const leads = data.leads || [];
  document.getElementById('hdrMeta').textContent = leads.length + ' leads · ' + filterLabel();
  detail.innerHTML = `
    <h2>Leads / WhatsApp</h2>
    <div class="sub">Contatos capturados · ${esc(filterLabel())}</div>
    <section>

            <th>Empresa</th>

        </tbody>

  `;
