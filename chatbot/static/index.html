function esc(s) {
 return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mdLite(s) {
 return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function reveal(el) {
 requestAnimationFrame(() => el.classList.add('vis'));
 el.querySelectorAll('[data-w]').forEach(b => {
 setTimeout(() => { b.style.width = b.dataset.w + '%'; }, 280);
 });
}
function append(html, scrollBlock) {
 const wrap = document.createElement('div');
 wrap.innerHTML = html;
 const node = wrap.firstElementChild;
 thread.appendChild(node);
 reveal(node);
 // Default: nao rolar (SEO/Marca/extras sao rapidos). So 'start' quando pedido.
 const block = scrollBlock === undefined ? 'none' : scrollBlock;
 if (block && block !== 'none') {
  node.scrollIntoView({ behavior: 'smooth', block: block });
 }
 return node;
}

function replaceSection(sectionKey, html, scrollBlock) {
 const existing = sectionKey ? document.querySelector(`[data-section="${sectionKey}"]`) : null;
 if (!existing) return append(html, scrollBlock);
 const wrap = document.createElement('div');
 wrap.innerHTML = html;
 const node = wrap.firstElementChild;
 if (!node) return existing;
 existing.replaceWith(node);
 reveal(node);
 const block = scrollBlock === undefined ? 'none' : scrollBlock;
 if (block && block !== 'none') {
  node.scrollIntoView({ behavior: 'smooth', block: block });
 }
 return node;
}

function companyHref(r, preferProfile) {

  const profile = String(r && r.url || '').trim();

 const dom = String(r && r.domain || '').trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').split('/')[0];
 if (dom) return 'https://' + dom + '/';
 if (!preferProfile) {

  if (fallback && !/adstransparency|adssettings|facebook\.com\/ads|ads\/library/i.test(fallback)) return fallback;
 }

 return append(`

let stageProgressTimer = null;

function clearStageProgressTimer() {
 if (stageProgressTimer) {
 clearInterval(stageProgressTimer);
 stageProgressTimer = null;
 }
}

function startStageBar(etaSeconds) {
 clearStageProgressTimer();
 const fill = document.getElementById('progressFill');
 if (!fill) return;
 const etaMs = Math.max(8000, (Number(etaSeconds) || 120) * 1000);
 const started = Date.now();
 fill.style.width = '4%';
 stageProgressTimer = setInterval(() => {
 const t = (Date.now() - started) / etaMs;
 // Avanca na etapa atual ate ~90%; o done leva a 100%
 const pct = Math.min(90, 4 + t * 86);
 fill.style.width = pct.toFixed(1) + '%';
 }, 400);
}

function finishStageBar() {
 clearStageProgressTimer();
 const fill = document.getElementById('progressFill');
 if (fill) fill.style.width = '100%';
}

function updateProgressUI(msg) {
 const label = document.getElementById('progressLabel');
 const detail = document.getElementById('progressDetail');
 const eta = document.getElementById('progressEta');
 if (msg.eta_label && eta) eta.textContent = 'Esta etapa: ' + msg.eta_label;
 if (msg.progress_label && label) label.textContent = msg.progress_label;
 if (msg.detail && detail) detail.textContent = msg.detail;
 if (msg.state === 'running') startStageBar(msg.eta_seconds);
 else if (msg.state === 'done') finishStageBar();
}

function updateSteps(steps) {
 if (!steps) return;
 Object.entries(steps).forEach(([id, info]) => {
 const el = document.querySelector(`.step[data-step="${id}"]`);
 if (!el) return;
 el.classList.remove('done', 'running', 'error');
 if (info.state === 'done') el.classList.add('done');
 if (info.state === 'running') el.classList.add('running');
 if (info.state === 'error') el.classList.add('error');
 if (info.detail) {
 const t = el.querySelector('.step-text');
 if (t) t.textContent = info.detail.length > 70 ? info.detail.slice(0, 70) + '…' : info.detail;
 }
 });
}

function parseLeadMessage(raw) {
 const text = (raw || '').trim();
 let name = '';
 let contact = '';
 // "Nome, contato" ou "Nome - contato" ou "Nome: contato"
 const parts = text.split(/[,;\n]| - | – | — |:/).map(s => s.trim()).filter(Boolean);
 if (parts.length >= 2) {
  // Prefer contact as the part with @ or many digits
  const withAt = parts.find(p => p.includes('@'));
  const withPhone = parts.find(p => (p.replace(/\D/g, '').length >= 10));
  contact = withAt || withPhone || parts[parts.length - 1];
  name = parts.find(p => p !== contact) || parts[0];
 } else {
  contact = text;
  if (text.includes('@')) name = text.split('@')[0].replace(/[._]/g, ' ');
 }
 name = (name || '').trim();
 contact = (contact || '').trim();
 return { name, contact };
}

async function openMercadoPagoCheckout(pending) {
 const node = append(`
  <div class="q-block reveal" data-section="checkout">
   <div class="bot-label"><span class="dot"></span>Radar da Concorrência</div>
   <div class="q-bubble">Abrindo o checkout do Mercado Pago (PIX ou cartão)…</div>
   <div class="pay-choice">
    <button type="button" data-pay-open>Abrir pagamento</button>
    <button type="button" data-pay-check hidden>Já paguei — verificar</button>
   </div>
   <div class="hint" data-pay-hint></div>
  </div>`, 'start');
 const hint = node.querySelector('[data-pay-hint]');
 const btnOpen = node.querySelector('[data-pay-open]');
 const btnCheck = node.querySelector('[data-pay-check]');
 let orderId = pending.orderId || '';
 let pollTimer = null;
 let paidDone = false;
 if (!window.__mpConfirmedOrders) window.__mpConfirmedOrders = new Set();

 async function checkPaid() {
  if (!orderId || paidDone) return false;
  if (window.__mpConfirmedOrders.has(orderId)) return true;
  try {
   const res = await fetch('/api/checkout/' + encodeURIComponent(orderId));
   const data = await res.json();
   if (data.paid) {
    if (paidDone) return true;
    paidDone = true;
    window.__mpConfirmedOrders.add(orderId);
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    try { sessionStorage.removeItem('radar_mp_pending'); } catch (e) {}
    contactPending = null;
    btnOpen.hidden = true;
    btnCheck.hidden = true;
    hint.textContent = '';
    addBotBubble(
     `Pagamento confirmado. Obrigado, **${pending.name || 'tudo certo'}**! `
     + `Sua análise Pro de **${pending.channelLabel || pending.channel}** entra na fila — em até 24h enviamos no contato cadastrado.`,
     false
    );
    const last = thread.lastElementChild;
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return true;
   }
   hint.textContent = data.mp_status
    ? ('Status Mercado Pago: ' + data.mp_status)
    : 'Aguardando confirmação do pagamento...';
  } catch (e) {
   hint.textContent = 'Não consegui verificar agora. Tente de novo em instantes.';
  }
  return false;
 }

 async function createAndOpen() {
  hint.textContent = 'Gerando checkout...';
  btnOpen.disabled = true;
  try {
   const res = await fetch('/api/checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
     channel: pending.channel,
     product: 'deep_channel',
     company: pending.company || analysisCtx.company || '',
     slug: pending.slug || analysisCtx.slug || '',
     job_id: pending.job_id || analysisCtx.job_id || '',
     lead_id: pending.leadId || '',
     name: pending.name || '',
     contact: pending.contact || '',
    }),
   });
   const data = await res.json();
   if (!res.ok) {
    hint.textContent = data.error || 'Falha ao criar pagamento';
    btnOpen.disabled = false;
    return;
   }
   orderId = data.order_id;
   pending.orderId = orderId;
   contactPending = { ...pending, phase: 'await_pay', orderId };
   try {
    sessionStorage.setItem('radar_mp_pending', JSON.stringify({
     order_id: orderId, channel: pending.channel, lead_id: pending.leadId, at: Date.now()
    }));
   } catch (e) {}
   const url = data.init_point || data.sandbox_init_point;
   if (!url) {
    hint.textContent = 'Checkout sem URL de pagamento.';
    btnOpen.disabled = false;
    return;
   }
   window.open(url, 'radar_mp_checkout');
   btnCheck.hidden = false;
   btnOpen.disabled = false;
   btnOpen.textContent = 'Reabrir pagamento';
   hint.textContent = 'Janela do Mercado Pago aberta. Conclua PIX ou cartão — esta aba do chat continua aqui.';
   if (!pollTimer) pollTimer = setInterval(() => { checkPaid(); }, 4000);
  } catch (e) {
   hint.textContent = e.message;
   btnOpen.disabled = false;
  }
 }

 btnOpen.addEventListener('click', () => createAndOpen());
 btnCheck.addEventListener('click', () => checkPaid());
 function onMpReturn(ev) {
  const d = ev && ev.data;
  if (!d || d.type !== 'mp_return') return;
  if (d.order_id) orderId = d.order_id;
  checkPaid();
 }
 window.addEventListener('message', onMpReturn);
 createAndOpen();
}

async function submitPendingContact(rawContact) {
 const pending = contactPending;
 if (!pending) return false;

 if (pending.phase === 'await_pay') {
  addBotBubble('Conclua o pagamento no Mercado Pago (ou clique em **Já paguei — verificar**). Se precisar, use **Reabrir pagamento**.');
  return true;
 }

 const { name, contact } = parseLeadMessage(rawContact);
 if (!contact || contact.length < 5) {
  addBotBubble('Envie **nome** e **e-mail ou WhatsApp**. Ex: `Maria Silva, maria@email.com`.');
  return true;
 }
 const looksEmail = contact.includes('@');
 const digits = contact.replace(/\D/g, '');
 if (!looksEmail && digits.length < 10) {
  addBotBubble('Não identifiquei e-mail nem WhatsApp com DDD. Tente de novo, por exemplo: `João, 11999999999`.');
  return true;
 }

 setBusy(true);
 try {
  const res = await fetch('/api/leads', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({
    offer: 'deep_channel',
    channel: pending.channel || '',
    name,
    contact,
    pre_payment: true,
    company: pending.company || analysisCtx.company || '',
    slug: pending.slug || analysisCtx.slug || '',
    job_id: pending.job_id || analysisCtx.job_id || '',
   }),
  });
  const data = await res.json();
  if (!res.ok) {
   addBotBubble(data.error || 'Não consegui salvar seus dados.');
   setBusy(false);
   return true;
  }
  const next = {
   ...pending,
   phase: 'await_pay',
   name: name || data.name || '',
   contact,
   leadId: data.lead_id || '',
  };
  contactPending = next;
  addBotBubble(
   `Perfeito, **${name || 'registrado'}**! Salvei seu contato. Agora vou abrir o **Mercado Pago** para o pagamento da análise Pro.`
  );
  setBusy(false);
  await openMercadoPagoCheckout(next);
 } catch (e) {
  addBotBubble('Falha ao salvar o contato: ' + e.message);
  setBusy(false);
 }
 return true;
}

async function startExtrasCheckout(root, btn) {
 if (busy) return;
 if (btn.dataset.mode === 'verify') {
  return; // handled by verify handler
 }
 if (!analysisCtx.slug && !analysisCtx.company) {
  addBotBubble('Rode uma análise gratuita primeiro (envie a URL do site) para eu ter o cliente dos canais extra.');
  return;
 }
 const hint = root.querySelector('[data-extras-hint]');
 if (btn) btn.disabled = true;
 if (hint) hint.textContent = 'Gerando checkout Mercado Pago...';
 let orderId = '';
 let pollTimer = null;
 let started = false;

 async function checkPaidAndRun() {
  if (!orderId || started) return false;
  try {
   const res = await fetch('/api/checkout/' + encodeURIComponent(orderId));
   const data = await res.json();
   if (data.paid) {
    started = true;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (hint) hint.textContent = 'Pagamento confirmado. Iniciando canais extra...';
    if (btn) btn.disabled = true;
    addBotBubble('Pagamento dos **canais extra** confirmado. Vou liberar Meta, Instagram, YouTube e TikTok.');
    startExtrasJob();
    return true;
   }
   if (hint) hint.textContent = data.mp_status
    ? ('Status Mercado Pago: ' + data.mp_status)
    : 'Aguardando confirmação do pagamento...';
  } catch (e) {
   if (hint) hint.textContent = 'Não consegui verificar agora. Tente de novo.';
  }
  return false;
 }

 try {
  const res = await fetch('/api/checkout', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({
    product: 'extras_pack',
    channel: 'canais-extra',
    company: analysisCtx.company || '',
    slug: analysisCtx.slug || '',
    job_id: analysisCtx.job_id || '',
   }),
  });
  const data = await res.json();
  if (!res.ok) {
   if (hint) hint.textContent = data.error || 'Falha ao criar pagamento';
   if (btn) btn.disabled = false;
   return;
  }
  orderId = data.order_id;
  try {
   sessionStorage.setItem('radar_mp_pending', JSON.stringify({
    order_id: orderId, product: 'extras_pack', at: Date.now()
   }));
  } catch (e) {}
  const url = data.init_point || data.sandbox_init_point;
  if (!url) {
   if (hint) hint.textContent = 'Checkout sem URL de pagamento.';
   if (btn) btn.disabled = false;
   return;
  }
  window.open(url, 'radar_mp_checkout');
  if (hint) hint.textContent = 'Janela do Mercado Pago aberta (PIX ou cartão). Esta aba do chat continua aqui — depois clique em verificar se não avançar sozinho.';
  if (btn) {
   btn.disabled = false;
   btn.dataset.mode = 'verify';
   btn.textContent = 'Já paguei — verificar';
   btn.addEventListener('click', (ev) => {
    ev.stopImmediatePropagation();
    checkPaidAndRun();
   });
  }
  pollTimer = setInterval(() => { checkPaidAndRun(); }, 4000);
  window.addEventListener('message', function onRet(ev) {
   const d = ev && ev.data;
   if (!d || d.type !== 'mp_return') return;
   if (d.order_id) orderId = d.order_id;
   checkPaidAndRun();
  });
 } catch (e) {
  if (hint) hint.textContent = e.message;
  if (btn) btn.disabled = false;
 }
}

 const res = await fetch('/api/hello');
 const data = await res.json();
 stepDefs = data.steps || [];
 if (VIDEO_MODE) {
  addBotBubble(
   'Modo **demo para vídeo**. Vou carregar o exemplo **Chatguru** (Ads, SEO, Marca) e em seguida os **canais extra**, sem checkout.',
   true
  );
  window.__proPrice = data.pro_price || 99;
  window.__extrasPrice = data.extras_price || data.pro_price || 99;
  setTimeout(() => startVideoDemo(), 900);
  return;
 }
 addBotBubble(data.greeting, true);
 window.__proPrice = data.pro_price || 99;
 window.__extrasPrice = data.extras_price || data.pro_price || 99;
 setTimeout(() => {
 const askNode = addBotBubble(data.ask, true);
 const hint = document.createElement('div');
 hint.className = 'hint';
 hint.innerHTML = 'Exemplo: <code>seusite.com.br</code>';
 askNode.appendChild(hint);
 }, 450);
 } catch (e) {
 addBotBubble('Nao consegui iniciar. Verifique se o servidor esta rodando.');
 }
}

async function startVideoDemo() {
 if (busy) return;
 setBusy(true);
 try {
  const res = await fetch('/api/chat', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({ message: 'demo chatguru' }),
  });
  const data = await res.json();
  if (!res.ok) {
   append(`<div class="q-block reveal"><div class="err-card">${esc(data.error || 'Erro ao iniciar demo')}</div></div>`);
   setBusy(false);
   return;
  }
  const jobId = data.job_id;
  stepDefs = data.steps || stepDefs;
  const p = data.parsed || {};
  analysisCtx = {
   company: p.company || 'Chatguru',
   slug: p.slug || 'chatguru',
   job_id: jobId,
   demo: true,
  };
  topMeta.textContent = 'Demo vídeo · Chatguru';
  addUserBubble('chatguru.com.br');
  addBotBubble(data.ack || 'Carregando o exemplo Chatguru...');
  const first = stepDefs[0] || {};
  const etaSec = first.eta_demo || 10;
  const etaGuess = etaSec >= 60 ? ('~' + Math.round(etaSec / 60) + ' min') : ('~' + etaSec + 's');
  renderStepsBlock(stepDefs, etaGuess);
  listenJobEvents(jobId, false);
 } catch (e) {
  append(`<div class="q-block reveal"><div class="err-card">${esc(e.message)}</div></div>`);
  setBusy(false);
 }
}

function setBusy(v) {
 busy = v;
 sendBtn.disabled = v;
 input.disabled = v;
 topStatus.textContent = v ? 'Analisando...' : 'Pronto';
}

async function startExtrasJob() {
 if (busy) return;
 if (!analysisCtx.slug && !analysisCtx.company) {
  addBotBubble('Rode uma análise gratuita primeiro (envie a URL do site) para eu ter o cliente dos canais extra.');
  return;
 }
 setBusy(true);
 try {
  const res = await fetch('/api/extras', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({
    slug: analysisCtx.slug || 'chatguru',
    company: analysisCtx.company || '',
    demo: VIDEO_MODE ? true : !!analysisCtx.demo,
    job_id: analysisCtx.job_id || '',
   }),
  });
  const data = await res.json();
  if (!res.ok) {
   append(`<div class="q-block reveal"><div class="err-card">${esc(data.error || 'Erro ao iniciar canais extra')}</div></div>`);
   setBusy(false);
   return;
  }
  const jobId = data.job_id;
  stepDefs = data.steps || [];
  addBotBubble(data.ack);
  const first = stepDefs[0] || {};
  const etaSec = analysisCtx.demo ? (first.eta_demo || 12) : (first.eta_live || 180);
  const etaGuess = etaSec >= 60 ? ('~' + Math.round(etaSec / 60) + ' min') : ('~' + etaSec + 's');
  renderStepsBlock(stepDefs, etaGuess);
  listenJobEvents(jobId, true);
 } catch (e) {
  append(`<div class="q-block reveal"><div class="err-card">${esc(e.message)}</div></div>`);
  setBusy(false);
 }
}


function applyEnrichReport(report) {
 if (!report || typeof report !== 'object') return;
 const client = report.client || analysisCtx.company || '';
 if (report.briefing || report.competitors) {
  handlePartial({
   section: 'briefing_concorrentes',
   client,
   data: {
    briefing: report.briefing || {},
    competitors: report.competitors || [],
    competitors_count: report.competitors_count,
    competitors_note: report.competitors_note || '',
    client,
   },
  });
 }
 if (report.google_ads) handlePartial({ section: 'google_ads', data: report.google_ads, client });
 if (report.seo) handlePartial({ section: 'seo', data: report.seo, client });
 if (report.brand) handlePartial({ section: 'brand', data: report.brand, client });
}

function finishEnrich(report) {
 if (window.__enrichDoneAt && (Date.now() - window.__enrichDoneAt) < 12000) return;
 window.__enrichDoneAt = Date.now();
 applyEnrichReport(report);
 addBotBubble('Pronto — relatórios atualizados com os concorrentes que você indicou.');
 topStatus.textContent = 'Pronto';
}

function showExtraCompetitorsPrompt(jobId, msg) {
 if (VIDEO_MODE) {
  // Demo gravavel: nao interrompe o fluxo pedindo concorrentes
  return;
 }
 if (document.querySelector('[data-extra-comps]')) return; // ja mostrado
 const text = (msg && msg.message) || 'Tem algum concorrente que não apareceu na lista? Informe e vamos adicionar. (Limite de 3 empresas.)';
 const node = append(`
 <div class="q-block reveal" data-extra-comps>
  <div class="bot-label"><span class="dot"></span>Radar da Concorrência</div>
  <div class="q-bubble">${mdLite(text)}</div>
  <div class="pay-form" style="display:flex">
   <input type="text" data-extra-input placeholder="Ex: empresa1.com.br, concorrente2, marca3" />
   <div class="pay-choice" style="margin-top:8px">
    <button type="button" data-extra-send>Adicionar e atualizar relatórios</button>
    <button type="button" data-extra-skip>Seguir sem adicionar</button>
   </div>
   <div class="hint">Até 3 empresas. O restante da análise (SEO/Marca) continua em paralelo.</div>
  </div>
 </div>`);
 const inp = node.querySelector('[data-extra-input]');
 const send = node.querySelector('[data-extra-send]');
 const skip = node.querySelector('[data-extra-skip]');
 async function submitEnrich(parts) {
  send.disabled = true; skip.disabled = true;
  if (!parts.length) {
   node.querySelector('.pay-form').style.display = 'none';
   addBotBubble('Ok, seguimos com a lista atual.');
   return;
  }
  addBotBubble(`Vou incluir **${parts.join(', ')}** e atualizar Ads, SEO e Marca. Pode levar alguns minutos.`);
  try {
   const res = await fetch('/api/competitors/enrich', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
     job_id: jobId || analysisCtx.job_id || '',
     slug: analysisCtx.slug || '',
     company: analysisCtx.company || '',
     demo: !!analysisCtx.demo,
     competitors: parts,
    }),
   });
   const data = await res.json();
   if (!res.ok) {
    addBotBubble(data.error || 'Não consegui atualizar os concorrentes.');
    send.disabled = false; skip.disabled = false;
    return;
   }
   node.querySelector('.pay-form').style.display = 'none';
   topStatus.textContent = 'Atualizando concorrentes...';
   // partials atualizados chegam pelo SSE do job pai (espelhados)
   if (data.job_id) {
    listenJobEvents(data.job_id, false);
   }
  } catch (e) {
   addBotBubble('Falha ao enriquecer: ' + e.message);
   send.disabled = false; skip.disabled = false;
  }
 }
 send.addEventListener('click', () => {
  const raw = (inp.value || '').trim();
  addUserBubble(raw || '(nenhum)');
  const parts = raw.split(/[,;\/\n]+/).map(s => s.trim()).filter(Boolean).slice(0, 3);
  submitEnrich(parts);
 });
 skip.addEventListener('click', () => {
  addUserBubble('Seguir sem adicionar');
  submitEnrich([]);
 });
 inp.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send.click();
 });
}

function listenJobEvents(jobId, isExtras) {
 let gotPartial = false;
 const es = new EventSource(`/api/jobs/${jobId}/events`);
 es.onmessage = (ev) => {
  let msg;
  try { msg = JSON.parse(ev.data); } catch { return; }
  if (msg.type === 'pipeline_meta') {
   updateProgressUI({
    eta_label: msg.eta_label,
    progress_label: 'Etapa 0/' + (msg.total_steps || 4),
    detail: msg.extras ? 'Canais extra...' : (msg.mode === 'live' ? 'Análise iniciada...' : 'Carregando dados...'),
    index: 0,
    total: msg.total_steps || 4,
    state: 'running',
   });
  }
  if (msg.type === 'step' || msg.type === 'snapshot') {
   updateSteps(msg.steps);
  }
  if (msg.type === 'progress') {
   updateSteps(msg.steps);
   updateProgressUI(msg);
   if (msg.progress_label) topStatus.textContent = msg.progress_label;
   if (msg.detail && String(msg.step_id || '').startsWith('enrich')) {
    topStatus.textContent = msg.detail;
   }
  }
  if (msg.type === 'prompt_extra_competitors' || msg.type === 'await_input') {
   showExtraCompetitorsPrompt(jobId, msg);
  }
  if (msg.type === 'enrich_complete') {
   finishEnrich(msg.report);
  }
  if (msg.type === 'enrich_error') {
   addBotBubble('Não consegui atualizar os concorrentes: ' + (msg.message || 'erro'));
   topStatus.textContent = 'Pronto';
  }
  if (msg.type === 'partial') {
   gotPartial = true;
   handlePartial(msg);
  }
  if (msg.type === 'complete') {
   if (msg.enrich) {
    finishEnrich(msg.report);
    es.close();
    return;
   }
   updateSteps(msg.steps || {});
   document.querySelectorAll('#stepsList .step').forEach(s => s.classList.add('done'));
   clearStageProgressTimer();
   const fill = document.getElementById('progressFill');
   const label = document.getElementById('progressLabel');
   const detail = document.getElementById('progressDetail');
   if (fill) fill.style.width = '100%';
   if (label) label.textContent = (msg.extras || isExtras) ? 'Extra 4/4' : 'Etapa 4/4';
   if (detail) detail.textContent = 'Analise concluida';
   const etaEl = document.getElementById('progressEta');
   if (etaEl) etaEl.textContent = 'Concluido';
   if (!gotPartial && msg.report && !(msg.extras || isExtras)) {
    renderReport(msg.report);
   }
   if (msg.extras || isExtras) {
    if (VIDEO_MODE) {
     addBotBubble('Demonstração concluída: Ads, SEO, Marca e canais extra (Meta, Instagram, YouTube e TikTok) com o exemplo **Chatguru**.');
    } else {
     addBotBubble('Canais extra concluídos. Cada bloco acima tem oferta Pro de análise profunda (entrega manual em até 24h).');
    }
    es.close();
    setBusy(false);
    return;
   }
   if (VIDEO_MODE) {
    addBotBubble('Etapas principais prontas. Agora liberando os **canais extra** (Meta, Instagram, YouTube, TikTok)...');
    es.close();
    setBusy(false);
    setTimeout(() => { startExtrasJob(); }, 700);
    return;
   }
   renderProFinale();
   addBotBubble('Pronto. Quer analisar outra empresa? Envie uma nova URL.');
   es.close();
   setBusy(false);
  }
  if (msg.type === 'error') {
   append(`<div class="q-block reveal"><div class="err-card">${esc(msg.message || 'Falha na pipeline')}</div></div>`);
   es.close();
   setBusy(false);
  }
 };
 es.onerror = () => {};
}

async function sendMessage() {
 const text = input.value.trim();
 if (!text) return;
 // Contato pos-clique Pro deve funcionar mesmo com pipeline "busy"
 if (busy && !contactPending) return;
 input.value = '';
 addUserBubble(text);

 if (contactPending) {
  await submitPendingContact(text);
  return;
 }

 setBusy(true);

 let jobId;
 try {
 const res = await fetch('/api/chat', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ message: text }),
 });
 const data = await res.json();
 if (!res.ok) {
 append(`<div class="q-block reveal"><div class="err-card">${esc(data.error || 'Erro')}</div></div>`);
 setBusy(false);
 return;
 }
 jobId = data.job_id;
 stepDefs = data.steps || stepDefs;
 const p = data.parsed || {};
 analysisCtx = {
  company: p.company || '',
  slug: p.slug || '',
  job_id: jobId,
  demo: !!p.demo,
 };
 topMeta.textContent = `${p.company || p.slug || 'cliente'}`;
 addBotBubble(data.ack);
 const first = stepDefs[0] || {};
 const etaSec = p.demo ? (first.eta_demo || 10) : (first.eta_live || 120);
 const etaGuess = etaSec >= 60 ? ('~' + Math.round(etaSec / 60) + ' min') : ('~' + etaSec + 's');
 renderStepsBlock(stepDefs, etaGuess);
 listenJobEvents(jobId, false);
 } catch (e) {
 append(`<div class="q-block reveal"><div class="err-card">${esc(e.message)}</div></div>`);
 setBusy(false);
 return;
 }
}


sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
 if (e.key === 'Enter') sendMessage();
});

boot();
</script>
