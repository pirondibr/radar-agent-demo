<div class="top">
 <div class="top-logo"><div class="top-mark">R</div><div class="top-name">Radar Agent</div><span class="top-version" id="appVersion">v1.2.1</span></div>
 <div class="top-sep"></div>
 <div class="top-status" id="topStatus">Pronto</div>
 <div class="top-right"><div class="top-meta" id="topMeta">MVP Ads + SEO + Marca</div></div>
</div>

<div class="main"><div class="thread" id="thread"></div></div>

<div class="composer">
 <div class="composer-inner">
 <input id="msgInput" type="text" placeholder="Empresa (URL ou nome) e opcionalmente 1 a 3 concorrentes..." autocomplete="off" />
 <button id="sendBtn" type="button">Enviar</button>
 </div>
</div>

<script>
/* Bump APP_VERSION a cada alteracao de UI/pipeline para detectar cache do browser */
const APP_VERSION = '1.3.1';
const thread = document.getElementById('thread');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const topStatus = document.getElementById('topStatus');
const topMeta = document.getElementById('topMeta');
const appVersionEl = document.getElementById('appVersion');
if (appVersionEl) appVersionEl.textContent = 'v' + APP_VERSION;
document.title = 'Radar Agent v' + APP_VERSION + ' | Consultor de Marketing';

let busy = false;
let stepDefs = [];
let analysisCtx = { company: '', slug: '', job_id: '', demo: false };

function esc(s) {
 return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mdLite(s) {
 return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function reveal(el) {
 requestAnimationFrame(() => el.classList.add('vis'));
 el.querySelectorAll('[data-w]').forEach(b => {
 setTimeout(() => { b.style.width = b.dataset.w + '%'; }, 280);
 });
}
function append(html) {
 const wrap = document.createElement('div');
 wrap.innerHTML = html;
 const node = wrap.firstElementChild;
 thread.appendChild(node);
 reveal(node);
 node.scrollIntoView({ behavior: 'smooth', block: 'end' });
 return node;
}

function addBotBubble(text, intro) {
 const cls = intro ? 'q-bubble intro' : 'q-bubble';

let stageProgressTimer = null;

function clearStageProgressTimer() {
 if (stageProgressTimer) {
 clearInterval(stageProgressTimer);
 stageProgressTimer = null;
 }
}

function startStageBar(etaSeconds) {
 clearStageProgressTimer();
 const fill = document.getElementById('progressFill');
 if (!fill) return;
 const etaMs = Math.max(8000, (Number(etaSeconds) || 120) * 1000);
 const started = Date.now();
 fill.style.width = '4%';
 stageProgressTimer = setInterval(() => {
 const t = (Date.now() - started) / etaMs;
 // Avanca na etapa atual ate ~90%; o done leva a 100%
 const pct = Math.min(90, 4 + t * 86);
 fill.style.width = pct.toFixed(1) + '%';
 }, 400);
}

function finishStageBar() {
 clearStageProgressTimer();
 const fill = document.getElementById('progressFill');
 if (fill) fill.style.width = '100%';
}

function updateProgressUI(msg) {
 const label = document.getElementById('progressLabel');
 const detail = document.getElementById('progressDetail');
 const eta = document.getElementById('progressEta');
 if (msg.eta_label && eta) eta.textContent = 'Esta etapa: ' + msg.eta_label;
 if (msg.progress_label && label) label.textContent = msg.progress_label;
 if (msg.detail && detail) detail.textContent = msg.detail;
 if (msg.state === 'running') startStageBar(msg.eta_seconds);
 else if (msg.state === 'done') finishStageBar();
}

function updateSteps(steps) {
 if (!steps) return;
 Object.entries(steps).forEach(([id, info]) => {
 const el = document.querySelector(`.step[data-step="${id}"]`);
 if (!el) return;
 el.classList.remove('done', 'running', 'error');
 if (info.state === 'done') el.classList.add('done');
 if (info.state === 'running') el.classList.add('running');
 if (info.state === 'error') el.classList.add('error');
 if (info.detail) {
 const t = el.querySelector('.step-text');
 if (t) t.textContent = info.detail.length > 70 ? info.detail.slice(0, 70) + '…' : info.detail;
 }
 });
}

function handlePartial(msg) {
 const section = msg.section;
 const data = msg.data || {};
 const client = msg.client || data.client || '';
 if (section === 'briefing_concorrentes') {
 renderBriefingCompetitors(data);
 } else if (section === 'briefing') {
 renderBriefingCompetitors({ briefing: data, competitors: [], client: data.client || client });
 } else if (section === 'competitors') {
 renderBriefingCompetitors({
 briefing: { client: client, summary: 'Concorrentes mapeados.', nicho: '', escopo: '', url: '' },
 competitors: data.competitors || [],
 competitors_count: data.competitors_count,
 client,
 });
 } else if (section === 'competitors_pending') {
 append(`<div class="q-block reveal"><div class="q-bubble">${mdLite(data.message || 'Concorrentes mapeados. Coletando metricas...')}</div></div>`);
 }
 else if (section === 'google_ads') renderAdsSection(data, client);
 else if (section === 'seo') renderSeoSection(data, client);
 else if (section === 'brand') renderBrandSection(data, client);
 else if (section === 'meta') renderCountChannel(
  data, 'Meta Ads Ranking', 'var(--violet)', 'M', 'lb-finale', 'ag-finale', 'ac-finale',
  'Canais extra 1/4: Quem anuncia mais no Meta?',

  }
 );
 else if (section === 'linkedin') renderCountChannel(

   channel: 'linkedin', questions: PRO_QUESTIONS_LINKEDIN,
   bubble: 'Quer aprofundar <strong>LinkedIn Ads</strong>? Na versão Pro abrimos mensagens e estrutura.',
   label: 'Radar Pro LinkedIn profundo',
   blurb: 'Exemplos de perguntas desbloqueadas na versão paga:',

  }

 else if (section === 'instagram') renderCountChannel(

function renderReport(report) {
 if (!report) return;

 });
 renderAdsSection(report.google_ads, report.client);
 renderSeoSection(report.seo, report.client);
 renderBrandSection(report.brand, report.client);
 renderProFinale();
 addBotBubble('Pronto. Quer analisar outra empresa? Envie uma nova URL, ou digite **demo** para ver o exemplo Chatguru.');
}

async function boot() {
 try {
 const res = await fetch('/api/hello');
 const data = await res.json();
 stepDefs = data.steps || [];
 addBotBubble(data.greeting, true);
 window.__proPrice = data.pro_price || 99;
 window.__extrasPrice = data.extras_price || data.pro_price || 99;
 setTimeout(() => {
 const askNode = addBotBubble(data.ask, true);
 const hint = document.createElement('div');
 hint.className = 'hint';
 hint.innerHTML = 'Exemplos: <code>demo</code>, <code>https://chatguru.com.br/</code>, <code>empresa.com.br concorrentes: a, b</code>';
 askNode.appendChild(hint);
 }, 450);
 } catch (e) {
 addBotBubble('Nao consegui iniciar. Verifique se o servidor esta rodando.');
 }
}

function setBusy(v) {
 busy = v;
 sendBtn.disabled = v;
 input.disabled = v;
 topStatus.textContent = v ? 'Analisando...' : 'Pronto';
}

async function startExtrasJob() {
 if (busy) return;
 if (!analysisCtx.slug && !analysisCtx.company) {
  addBotBubble('Rode uma análise gratuita primeiro (URL ou **demo**) para eu ter o cliente dos canais extra.');
  return;
 }
 setBusy(true);
 try {
  const res = await fetch('/api/extras', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({
    slug: analysisCtx.slug || 'chatguru',
    company: analysisCtx.company || '',
    demo: !!analysisCtx.demo,
    job_id: analysisCtx.job_id || '',
   }),
  });
  const data = await res.json();
  if (!res.ok) {
   append(`<div class="q-block reveal"><div class="err-card">${esc(data.error || 'Erro ao iniciar canais extra')}</div></div>`);
   setBusy(false);
   return;
  }
  const jobId = data.job_id;
  stepDefs = data.steps || [];
  addBotBubble(data.ack);
  const first = stepDefs[0] || {};
  const etaSec = analysisCtx.demo ? (first.eta_demo || 12) : (first.eta_live || 180);
  const etaGuess = etaSec >= 60 ? ('~' + Math.round(etaSec / 60) + ' min') : ('~' + etaSec + 's');
  renderStepsBlock(stepDefs, etaGuess);
  listenJobEvents(jobId, true);
 } catch (e) {
  append(`<div class="q-block reveal"><div class="err-card">${esc(e.message)}</div></div>`);
  setBusy(false);
 }
}

function listenJobEvents(jobId, isExtras) {
 let gotPartial = false;
 const es = new EventSource(`/api/jobs/${jobId}/events`);
 es.onmessage = (ev) => {
  let msg;
  try { msg = JSON.parse(ev.data); } catch { return; }
  if (msg.type === 'pipeline_meta') {
   updateProgressUI({
    eta_label: msg.eta_label,
    progress_label: 'Etapa 0/' + (msg.total_steps || 4),
    detail: msg.extras ? 'Canais extra...' : (msg.mode === 'live' ? 'Pipeline ao vivo iniciada...' : (msg.mode === 'demo' ? 'Modo demo...' : 'Carregando dados...')),
    index: 0,
    total: msg.total_steps || 4,
    state: 'running',
   });
  }
  if (msg.type === 'step' || msg.type === 'snapshot') {
   updateSteps(msg.steps);
  }
  if (msg.type === 'progress') {
   updateSteps(msg.steps);
   updateProgressUI(msg);
   if (msg.progress_label) topStatus.textContent = msg.progress_label;
  }
  if (msg.type === 'partial') {
   gotPartial = true;
   handlePartial(msg);
  }
  if (msg.type === 'complete') {
   updateSteps(msg.steps || {});
   document.querySelectorAll('#stepsList .step').forEach(s => s.classList.add('done'));
   clearStageProgressTimer();
   const fill = document.getElementById('progressFill');
   const label = document.getElementById('progressLabel');
   const detail = document.getElementById('progressDetail');
   if (fill) fill.style.width = '100%';
   if (label) label.textContent = (msg.extras || isExtras) ? 'Extra 4/4' : 'Etapa 4/4';
   if (detail) detail.textContent = 'Analise concluida';
   const etaEl = document.getElementById('progressEta');
   if (etaEl) etaEl.textContent = 'Concluido';
   if (!gotPartial && msg.report && !(msg.extras || isExtras)) {
    renderReport(msg.report);
   } else if (msg.extras || isExtras) {
    addBotBubble('Canais extra concluídos. Cada bloco acima tem oferta Pro de análise profunda (entrega manual em até 24h).');
   } else {
    renderProFinale();
    addBotBubble('Pronto. Quer analisar outra empresa? Envie uma nova URL, ou digite **demo** para ver o exemplo Chatguru.');
   }
   es.close();
   setBusy(false);
  }
  if (msg.type === 'error') {
   append(`<div class="q-block reveal"><div class="err-card">${esc(msg.message || 'Falha na pipeline')}</div></div>`);
   es.close();
   setBusy(false);
  }
 };
 es.onerror = () => {};
}

async function sendMessage() {
 const text = input.value.trim();
 if (!text || busy) return;
 input.value = '';
 addUserBubble(text);
 setBusy(true);

 let jobId;
 try {
 const res = await fetch('/api/chat', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ message: text }),
 });
 const data = await res.json();
 if (!res.ok) {
 append(`<div class="q-block reveal"><div class="err-card">${esc(data.error || 'Erro')}</div></div>`);
 setBusy(false);
 return;
 }
 jobId = data.job_id;
 stepDefs = data.steps || stepDefs;
 const p = data.parsed || {};
 analysisCtx = {
  company: p.company || '',
  slug: p.slug || '',
  job_id: jobId,
  demo: !!p.demo,
 };
 topMeta.textContent = `${p.company || p.slug || 'cliente'}${p.demo ? ' (demo)' : ''}`;
 addBotBubble(data.ack);
 const first = stepDefs[0] || {};
 const etaSec = p.demo ? (first.eta_demo || 10) : (first.eta_live || 120);
 const etaGuess = etaSec >= 60 ? ('~' + Math.round(etaSec / 60) + ' min') : ('~' + etaSec + 's');
 renderStepsBlock(stepDefs, etaGuess);
 listenJobEvents(jobId, false);
 } catch (e) {
 append(`<div class="q-block reveal"><div class="err-card">${esc(e.message)}</div></div>`);
 setBusy(false);
 return;
 }
}


sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
 if (e.key === 'Enter') sendMessage();
});

boot();
