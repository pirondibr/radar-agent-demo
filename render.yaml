services:
  - type: web
    name: radar-agent-demo
    runtime: python
    plan: pro
    buildCommand: pip install -r chatbot/requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 900 --graceful-timeout 60 --keep-alive 75 --chdir chatbot server:app
    disk:
      name: radar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEMO_ONLY
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: RADAR_DATA_DIR
        value: /var/data
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SCRAPINGBEE_API_KEY
        sync: false
      - key: DATAFORSEO_USER
        sync: false
      - key: DATAFORSEO_PASS
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_SANDBOX
        value: "0"
      - key: PUBLIC_BASE_URL
        value: "https://agente.radardaconcorrencia.com.br"
      - key: PRO_PRICE_BRL
        value: "99"
